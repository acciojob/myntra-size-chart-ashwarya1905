<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Size Chart</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      padding: 30px;
    }

    table {
      width: 80%;
      margin: auto;
      border-collapse: collapse;
      background-color: white;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }

    thead {
      background-color: #f2f2f2;
    }

    th {
      font-weight: bold;
    }

    tbody tr:nth-child(even) {
      background-color: #fafafa;
    }
  </style>
</head>

<body>

  <table>
    <thead>
      <tr>
        <th>Size</th>
        <th>Chest</th>
        <th>Waist</th>
        <th>Hip</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>S</td>
        <td>38</td>
        <td>32</td>
        <td>38</td>
      </tr>

      <tr>
        <td>M</td>
        <td>40</td>
        <td>34</td>
        <td>40</td>
      </tr>

      <tr>
        <td>L</td>
        <td>42</td>
        <td>36</td>
        <td>42</td>
      </tr>

      <tr>
        <td>XL</td>
        <td>44</td>
        <td>38</td>
        <td>44</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
